<title>Murajaah</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#18231f;--mu:#7a847f;--pr:#0b6b60;--pl:#e1f1ed;--bd:#ebe7dd;--gd:#b8902f;--gl:#f7efd8;--sh:0 6px 20px rgba(20,40,35,.07)}
body.dark{--bg:#0b1311;--card:#131e1b;--tx:#e8eeeb;--mu:#8b9a94;--pr:#3fd0b4;--pl:#153630;--bd:#21302b;--gd:#e0bb62;--gl:#2d2714;--sh:0 6px 20px rgba(0,0,0,.35)}

html,body{overscroll-behavior-y:contain}
button,nav,.chips,.seg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@font-face{font-family:"Amiri";src:local("Amiri"),url(amiri.woff2) format("woff2");font-display:swap}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:104px;transition:background .3s}
h1,h2,.serif{font-family:Georgia,"Times New Roman",serif;letter-spacing:.2px}
header{background:linear-gradient(135deg,#093f39,#0b6b60 60%,#13897c);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 18px 50px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(224,187,98,.38),transparent 70%)}
.brand{display:flex;gap:13px;align-items:center;position:relative;z-index:1;max-width:640px;margin:auto}
.brand svg{width:48px;height:48px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.3);flex:none}
.brand h1{margin:0;font-size:22px;font-weight:700}
.brand p{margin:2px 0 0;font-size:12px;opacity:.85}
main{padding:0 14px;max-width:640px;margin:-30px auto 0;position:relative;z-index:2}
.pt{font-size:22px;margin:42px 4px 12px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{margin:0 0 10px;font-size:16px}
.nb{background:var(--gl);color:var(--gd);font-weight:600;padding:12px 16px;font-size:14px}
.hero{background:linear-gradient(135deg,#0a4d45,#0e7a6d);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-30px;bottom:-60px;width:180px;height:180px;border-radius:50%;border:26px solid rgba(224,187,98,.14)}
.hero .top{display:flex;align-items:center;gap:14px;position:relative}
.hero .top>div:first-child{flex:1}
.hero small{opacity:.8;font-size:12px}
.hero h2{font-size:21px;margin:3px 0 4px}
.ring{position:relative;width:78px;height:78px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.go{width:100%;margin-top:14px;padding:14px;font-size:16px;border-radius:14px;background:linear-gradient(135deg,#e6c46d,#c9a03f);color:#3a2c05;box-shadow:0 6px 16px rgba(0,0,0,.25);position:relative}

.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}.row b{display:block;font-size:15px;font-weight:600}.row small{color:var(--mu);font-size:12px}
.row .nt{display:block;color:var(--gd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
button{font:inherit;border:0;border-radius:12px;padding:9px 14px;background:var(--pl);color:var(--pr);font-weight:600;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.96)}
button.p{background:var(--pr);color:#fff}
button.s0{background:var(--bd);color:var(--mu)}button.s1{background:var(--gl);color:var(--gd)}button.s2{background:var(--pl);color:var(--pr)}
.ck2,.nbtn{width:38px;height:38px;padding:0;border-radius:50%;font-size:17px;background:var(--bd);color:var(--mu);flex:none}
.ck2.done{background:var(--pr);color:#fff}
.nbtn{width:34px;height:34px;font-size:15px}.nbtn.has{background:var(--gl);color:var(--gd)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:7px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--gd));border-radius:6px;transition:width .4s}
.big{font-size:36px;font-weight:700;color:var(--pr)}
.stats{display:flex;gap:8px}.stats>div{flex:1;text-align:center;background:var(--bg);border-radius:14px;padding:12px 4px}
.stats small{color:var(--mu);display:block;font-size:11px}.stats b{font-size:20px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips button{white-space:nowrap;padding:8px 14px;font-size:13px;background:var(--card);color:var(--mu);box-shadow:var(--sh)}
.chips button.on{background:var(--pr);color:#fff}
.seg{display:flex;background:var(--bd);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{flex:1;background:none;color:var(--mu);border-radius:11px;padding:10px}
.seg button.on{background:var(--card);color:var(--pr);box-shadow:var(--sh)}
.hint{color:var(--mu);font-size:12px;margin:0 4px 12px;display:block}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:520px;margin:auto;display:flex;background:var(--card);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;z-index:5}
nav button{flex:1;background:none;border-radius:18px;color:var(--mu);padding:8px 2px;font-size:11px;font-weight:500}
nav button span{display:block;font-size:19px}nav button.on{background:var(--pl);color:var(--pr);font-weight:700}
.wk{display:flex;gap:7px;align-items:flex-end;height:84px}.wk div{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.wk i{display:block;background:linear-gradient(var(--gd),var(--pr));border-radius:6px 6px 0 0;min-height:3px;margin-bottom:3px}
.step{display:flex;align-items:center;gap:12px}.step b{font-size:21px;min-width:26px;text-align:center}
.step button{width:36px;height:36px;padding:0;border-radius:50%;font-size:20px}
.empty{color:var(--mu);font-size:14px;padding:6px 0}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--bd)}
.set:first-of-type{border-top:0}
.set small{color:var(--mu);display:block;font-size:12px;margin-top:2px}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:8px;background:var(--gl);color:var(--gd);font-weight:700;margin-left:6px;vertical-align:middle}

.pr2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.pr2 button{padding:7px 12px;font-size:13px}
.ov{position:fixed;inset:0;z-index:20;display:none}

.sb{padding:18px 16px;overflow-y:auto;flex:1}
.sf{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card)}
.sf button{flex:1;padding:13px}

textarea{resize:vertical}
.gh{font-size:12px;font-weight:700;color:var(--gd);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.8px}
.ckl{display:flex;gap:10px;align-items:center;padding:9px 12px;background:var(--card);border-radius:12px;margin-bottom:5px;font-size:14px}

.ckl small{color:var(--mu);font-size:12px}
.sw{min-width:64px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:12px;background:var(--bd);color:var(--mu)}
.cal .h{background:none;aspect-ratio:auto;font-size:11px;font-weight:700}
.cal .l1{background:var(--pl);color:var(--pr)}
.cal .l2{background:#7cc9bd;color:#08342e}
.cal .l3{background:var(--pr);color:#fff}
.cal .td{outline:2px solid var(--gd);outline-offset:-2px}
.qq{font-size:13px;opacity:.8}
.qb{border:2px dashed rgba(255,255,255,.35);border-radius:16px;padding:20px 14px;color:rgba(255,255,255,.85);width:100%;margin-top:8px}
.ar{font-family:"Amiri","Scheherazade New","Noto Naskh Arabic","Traditional Arabic",serif;direction:rtl;line-height:2.3;font-size:calc(24px*var(--tz,1));padding:6px 4px;text-align:justify;text-align-last:right}
.av{color:var(--gd);font-size:.7em;white-space:nowrap}
.sh2{text-align:center;color:var(--gd);font-weight:700;font-family:Georgia,serif;margin:14px 0 2px}
.tn{color:var(--mu);font-size:12px;margin:6px 0}
#ss .ar{font-size:calc(26px*var(--tz,1));width:100%;color:#fff}
#ss .av{color:#e6c46d}
#ss .sh2{color:#e6c46d}
#ss .tn{color:rgba(255,255,255,.7)}
#ss{background:linear-gradient(160deg,#093f39,#0b6b60 55%,#0e8174);color:#fff;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(20px + env(safe-area-inset-bottom))}
#ss .tp{display:flex;align-items:center;gap:12px}#ss .tp .bar{flex:1;background:rgba(255,255,255,.2)}
#ss .x{background:rgba(255,255,255,.15);color:#fff;width:38px;height:38px;padding:0;border-radius:50%}
#ss .op{display:block;width:100%;background:rgba(255,255,255,.13);color:#fff;border-radius:14px;padding:12px 14px;margin:6px 0;font-size:16px;text-align:center}
#ss .op .ar{font-size:calc(20px*var(--tz,1));padding:0;text-align:center;text-align-last:center}
#ss .op.ok{background:#2e9c6b}#ss .op.no{background:#b5483f}
#ss .ft{display:none;margin-left:auto;font-variant-numeric:tabular-nums;opacity:.85}#ss.fk .ft{display:block}
#ss.fk .tp .bar,#ss.fk .tp small,#ss.fk .tp .x:not(:first-child),#ss.fk .fx{display:none}
.fx{display:flex;flex-direction:column;align-items:center;gap:10px}
#ss .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:10px;overflow-y:auto}
#ss .mid>:first-child{margin-top:auto}
#ss .mid>:last-child{margin-bottom:auto}
#ss .nm{font-size:34px;font-weight:700;line-height:1.25;padding:0 6px}
#ss .sub{font-size:17px;opacity:.9;padding:0 8px}
#ss .sn{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 14px;font-size:14px;max-width:100%;text-align:left;white-space:pre-wrap}
#ss .bt{display:flex;flex-direction:column;gap:10px}
#ss .bt button{padding:15px;font-size:16px;border-radius:16px}
.b1{background:linear-gradient(135deg,#e6c46d,#c9a03f);color:#3a2c05}.b2{background:rgba(255,255,255,.16);color:#fff}.b3{background:none;color:rgba(255,255,255,.7)}
</style>
</head>

   similar(me,map,0.15).forEach(function(x){if(ds.length<2&&!seen[x.t]){seen[x.t]=1;ds.push(x.t)}});
   shuf(map.slice()).forEach(function(x){if(ds.length<2&&!seen[x.t]&&!(x.s==p[0]&&x.a==p[1])){seen[x.t]=1;ds.push(x.t)}});

   else if(mine.length){pk=mine[0];sm=similar(pk,map,0.3)}
   if(pk){var ids=[],seenU={};seenU[u.id]=1;sm.forEach(function(x){if(ids.length<3&&!seenU[x.u]){seenU[x.u]=1;ids.push(x.u)}});
